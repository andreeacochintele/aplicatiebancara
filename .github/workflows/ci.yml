name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

# No frontend job: npm is off-limits organization-wide, including for CI
# runners. Frontend is verified manually for now via
# `docker compose exec frontend npm run build` — see
# docs/local-dev-without-npm for the local-dev npm constraint.
