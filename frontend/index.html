<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>EasyB</title>
    <script>
      (function () {
        var stored = localStorage.getItem("banking_app_theme");
        var hiveMode = localStorage.getItem("banking_app_hive_mode");
        document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : "dark";
        document.documentElement.dataset.hiveMode = hiveMode === "on" ? "on" : "off";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
